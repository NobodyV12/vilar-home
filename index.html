<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f12" />
    <title>Vilar Home</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="signin" class="screen" hidden>
      <div class="signin-card">
        <img src="icon.svg" alt="" class="signin-icon" />
        <h1>Vilar Home</h1>
        <p class="muted">The pictures on the living room TV.</p>
        <form id="signin-form">
          <label>Email<input id="email" type="email" autocomplete="username" required /></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit" class="primary">Sign in</button>
          <p id="signin-error" class="error" hidden></p>
        </form>
      </div>
    </main>

    <main id="app" class="screen" hidden>
      <header class="top">
        <div>
          <h1>Vilar Home</h1>
          <p class="muted" id="who"></p>
        </div>
        <button id="signout" class="ghost">Sign out</button>
      </header>

      <section class="card">
        <h2>Right now the TV shows</h2>
        <div class="segmented" role="radiogroup" aria-label="TV background">
          <button data-bg="scenery" role="radio">Scenery</button>
          <button data-bg="photos" role="radio">Family photos</button>
        </div>
        <label class="switch-row">
          <span>
            Shuffle family photos
            <small class="muted">Off: they play in the order below.</small>
          </span>
          <input id="shuffle" type="checkbox" role="switch" />
        </label>
        <div class="seconds-row">
          <span>Each picture stays up</span>
          <div class="segmented small" role="radiogroup" aria-label="Seconds per picture">
            <button data-seconds="5" role="radio">5s</button>
            <button data-seconds="10" role="radio">10s</button>
            <button data-seconds="15" role="radio">15s</button>
            <button data-seconds="30" role="radio">30s</button>
          </div>
        </div>
        <p class="muted loop" id="loop"></p>
      </section>

      <div class="library-head">
        <h2>Your pictures</h2>
        <div class="library-actions">
          <button id="arrange" class="ghost">Arrange</button>
          <button id="choose" class="ghost">Choose what's on TV</button>
        </div>
      </div>
      <nav class="tabs">
        <button data-tab="family" class="active">Family photos <span id="count-family"></span></button>
        <button data-tab="scenery">Scenery <span id="count-scenery"></span></button>
      </nav>
      <p class="muted hint" id="tab-hint"></p>
      <p class="on-count" id="on-count"></p>

      <div id="grid" class="grid"></div>
      <p id="empty" class="muted empty" hidden>No pictures yet. Tap + to add some.</p>

      <label class="fab" aria-label="Add pictures">
        <input id="picker" type="file" accept="image/*" multiple hidden />
        <span>+</span>
      </label>
    </main>

    <div id="viewer" class="viewer" hidden>
      <img id="viewer-img" alt="" />
      <div class="viewer-bar">
        <p class="muted" id="viewer-meta"></p>
        <div class="viewer-actions">
          <button id="viewer-close" class="ghost">Close</button>
          <button id="viewer-toggle" class="ghost">Take off TV</button>
          <button id="viewer-delete" class="danger">Delete</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
